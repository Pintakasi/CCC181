{% extends "base.html" %}

{% block content %}
  <p>Hello, {{ name }}!</p>

  <h2>Tickets in the queue</h2>
  <ul class="tickets">
    {% for ticket in tickets %}
      <li>
        <a href="{{ url_for('ticket', ticket_id=ticket['ticket_id']) }}">
          #{{ ticket['ticket_id'] }} - {{ ticket['name'] }}
        </a>
      </li>
    {% else %}
      <li>The queue is empty.</li>
    {% endfor %}
  </ul>
{% endblock %}
