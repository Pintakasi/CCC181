services:
  db:
    image: postgres:17
    container_name: fixpoint-db
    environment:
      POSTGRES_USER: fixpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fixpoint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixpoint -d fixpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: